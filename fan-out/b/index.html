<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Notifier — age footer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #25272a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    .stage { display: grid; justify-items: center; padding: 28px 0 32px; }
    .progress-panel { width: 350px; padding: 10px; border-radius: 20px; background: rgba(232, 233, 235, .88); backdrop-filter: blur(24px) saturate(125%); -webkit-backdrop-filter: blur(24px) saturate(125%); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08), 0 12px 28px rgba(0, 0, 0, .12); }
    .panel-header { display: flex; align-items: center; gap: 8px; padding: 0 4px; height: 24px; margin-bottom: 8px; }
    .panel-title { margin: 0; font-size: 17px; font-weight: 600; line-height: 22px; flex: 1; }
    .active-count { font-size: 10px; font-weight: 500; line-height: 12px; padding: 4px 8px; color: #67696e; border-radius: 20px; background: rgba(0, 0, 0, .05); white-space: nowrap; }
    .window-controls { display: flex; gap: 4px; }
    button { display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #717378; font: inherit; }
    .window-controls button { width: 24px; height: 24px; font-size: 14px; }
    .entries { display: grid; gap: 6px; padding: 4px; }
    .entry { padding: 9px 12px; border-radius: 12px; background: rgba(0, 0, 0, .035); }
    .entry-main { display: flex; align-items: flex-start; gap: 8px; }
    .entry-copy { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .project { display: flex; align-items: center; gap: 5px; min-width: 0; height: 13px; font-size: 10px; font-weight: 500; color: #67696e; }
    .project-icon { width: 11px; height: 11px; border-radius: 3px; background: #6d8fa0; display: grid; place-items: center; color: white; font-size: 8px; }
    .entry-title { margin: 0; font-size: 13px; font-weight: 600; line-height: 16px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .eta { margin: 0; font-size: 11px; line-height: 14px; color: #67696e; font-variant-numeric: tabular-nums; }
    .dismiss { flex: 0 0 22px; height: 22px; font-size: 14px; line-height: 1; }
    .task-icon { flex: 0 0 24px; height: 24px; border-radius: 7px; background: rgba(59, 184, 163, .12); color: #3bb8a3; font-size: 16px; font-weight: 600; }
    .progress-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; height: 16px; }
    .progress-track { height: 5px; flex: 1; overflow: hidden; border-radius: 5px; background: rgba(59, 184, 163, .13); }
    .progress-fill { height: 5px; width: var(--progress); border-radius: inherit; background: #3bb8a3; }
    .percentage { width: 38px; text-align: right; color: #319c8b; font-size: 13px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; font-family: ui-rounded, -apple-system, BlinkMacSystemFont, sans-serif; }
    /* New content: a quiet, full-width footer after the existing progress row. */
    .added-age { margin: 5px 0 0; color: #696c71; font-size: 10px; line-height: 13px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main class="stage">
    <!-- Extract .progress-panel and its CSS to combine this attempt with others. -->
    <section class="progress-panel" aria-label="Expanded progress panel">
      <header class="panel-header">
        <h1 class="panel-title">Progress</h1>
        <span class="active-count">2 active</span>
        <div class="window-controls">
          <button type="button" aria-label="Minimize progress">−</button>
          <button type="button" aria-label="Close progress window">×</button>
        </div>
      </header>
      <div class="entries">
        <article class="entry" aria-labelledby="task-one">
          <div class="entry-main">
            <div class="entry-copy">
              <div class="project"><span class="project-icon" aria-hidden="true">P</span>Progress Notifier</div>
              <h2 class="entry-title" id="task-one">Refining expanded progress cards and timestamp placement</h2>
              <p class="eta">About 3m left</p>
            </div>
            <button type="button" class="dismiss" aria-label="Dismiss Refining expanded progress cards and timestamp placement">×</button>
          </div>
          <div class="progress-row">
            <div class="progress-track" role="progressbar" aria-label="Refining expanded progress cards and timestamp placement" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="--progress: 64%"></div></div>
            <span class="percentage" aria-hidden="true">64%</span>
          </div>
          <p class="added-age">Added 5 minutes ago</p>
        </article>
        <article class="entry" aria-labelledby="task-two">
          <div class="entry-main">
            <span class="task-icon" aria-hidden="true">⟳</span>
            <div class="entry-copy">
              <h2 class="entry-title" id="task-two">Preparing a preview of the latest design changes</h2>
              <p class="eta">About 50s left</p>
            </div>
            <button type="button" class="dismiss" aria-label="Dismiss Preparing a preview of the latest design changes">×</button>
          </div>
          <div class="progress-row">
            <div class="progress-track" role="progressbar" aria-label="Preparing a preview of the latest design changes" aria-valuenow="28" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="--progress: 28%"></div></div>
            <span class="percentage" aria-hidden="true">28%</span>
          </div>
          <p class="added-age">Added 47 seconds ago</p>
        </article>
      </div>
    </section>
  </main>
  <script>
    // Read-only fit checks; the fixtures deliberately stay static for comparison.
    window.addEventListener('load', () => {
      const panel = document.querySelector('.progress-panel');
      const titles = [...document.querySelectorAll('.entry-title')];
      const overflowing = [...panel.querySelectorAll('*')].filter(el => el.scrollWidth > el.clientWidth + 1);
      console.log(JSON.stringify({
        panelWidth: panel.getBoundingClientRect().width,
        itemCount: document.querySelectorAll('.entry').length,
        titleLineCounts: titles.map(el => el.getBoundingClientRect().height / 16),
        horizontalOverflowCount: overflowing.length,
        ageLabels: [...document.querySelectorAll('.added-age')].map(el => el.textContent)
      }));
    });
  </script>
</body>
</html>
