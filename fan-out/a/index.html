<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Notifier — timestamp footer</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      color: #292b2d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      display: grid;
      justify-items: center;
      padding: 28px 0 36px;
      background: radial-gradient(ellipse at 20% 20%, #dce5e3, transparent 65%), #e5e6e8;
    }
    .progress-panel {
      width: 350px;
      padding: 10px;
      border-radius: 20px;
      background: rgba(248, 248, 248, .79);
      backdrop-filter: blur(24px) saturate(110%);
      -webkit-backdrop-filter: blur(24px) saturate(110%);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08), 0 12px 30px rgba(33, 39, 43, .15);
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
      min-height: 25px;
      margin-bottom: 8px;
    }
    .panel-title { margin: 0 auto 0 0; font-size: 17px; font-weight: 600; }
    .active-count {
      padding: 4px 8px;
      border-radius: 100px;
      background: rgba(0, 0, 0, .05);
      color: #6c6e71;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
    }
    .panel-controls { display: flex; gap: 4px; }
    button {
      border: 0;
      background: transparent;
      color: #747679;
      display: grid;
      place-items: center;
      padding: 0;
      font: inherit;
      cursor: default;
    }
    .panel-controls button { width: 24px; height: 24px; }
    button svg { width: 11px; height: 11px; }
    button:focus-visible { outline: 2px solid #3bb8a3; outline-offset: 1px; border-radius: 5px; }
    .item-list { display: grid; gap: 6px; padding: 4px; }
    .item-card {
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, .035);
      --mint: #3bb8a3;
    }
    .item-heading { display: flex; align-items: flex-start; gap: 8px; }
    .item-copy { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .project {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #737577;
      font-size: 10px;
      font-weight: 500;
      line-height: 13px;
    }
    .project-icon { width: 12px; height: 12px; color: #6b7d7b; flex-shrink: 0; }
    .item-title {
      margin: 0;
      font-size: 13px;
      line-height: 16px;
      font-weight: 600;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    .eta { margin: 0; font-size: 11px; line-height: 14px; color: #737577; font-variant-numeric: tabular-nums; }
    .dismiss { width: 22px; height: 22px; flex: 0 0 22px; }
    .dismiss svg { width: 10px; height: 10px; }
    .task-icon {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      display: grid;
      place-items: center;
      color: var(--mint);
      background: rgba(59, 184, 163, .12);
      border-radius: 7px;
    }
    .task-icon svg { width: 14px; height: 14px; }
    .progress-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; height: 16px; }
    .progress-track { flex: 1; height: 5px; border-radius: 100px; background: rgba(59, 184, 163, .13); overflow: hidden; }
    .progress-fill { height: 5px; border-radius: inherit; background: var(--mint); }
    .percentage { width: 38px; text-align: right; color: #309d8c; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    /* The only new information: a full-width footer below the existing progress row. */
    .added { margin: 6px 0 0; color: #77797c; font-size: 10px; line-height: 13px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main class="stage">
    <!-- Extract this section and its CSS for a side-by-side comparison. -->
    <section class="progress-panel" aria-label="Expanded progress panel">
      <header class="panel-header">
        <h1 class="panel-title">Progress</h1>
        <span class="active-count">2 active</span>
        <div class="panel-controls">
          <button type="button" aria-label="Minimize progress"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 6h8"/></svg></button>
          <button type="button" aria-label="Close progress window"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="m2.5 2.5 7 7m0-7-7 7"/></svg></button>
        </div>
      </header>
      <div class="item-list">
        <article class="item-card" aria-labelledby="task-one">
          <div class="item-heading">
            <div class="item-copy">
              <div class="project"><svg class="project-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><rect x="1" y="1" width="10" height="10" rx="2.5"/><path d="m3.5 6 1.6 1.6 3.4-3.4"/></svg><span>Progress Notifier</span></div>
              <h2 class="item-title" id="task-one">Refining expanded task cards and timestamp placement</h2>
              <p class="eta">About 4m left</p>
            </div>
            <button class="dismiss" type="button" aria-label="Dismiss Refining expanded task cards and timestamp placement"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="m2.5 2.5 7 7m0-7-7 7"/></svg></button>
          </div>
          <div class="progress-row">
            <div class="progress-track" role="progressbar" aria-label="Refining expanded task cards and timestamp placement" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64"><div class="progress-fill" style="width:64%"></div></div>
            <span class="percentage">64%</span>
          </div>
          <p class="added">Added 5 minutes ago</p>
        </article>
        <article class="item-card" aria-labelledby="task-two">
          <div class="item-heading">
            <span class="task-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12.9 6a5.1 5.1 0 0 0-8.7-2L2.5 5.5m0-3v3h3M3.1 10a5.1 5.1 0 0 0 8.7 2l1.7-1.5m0 3v-3h-3"/></svg></span>
            <div class="item-copy">
              <h2 class="item-title" id="task-two">Preparing a preview of the updated notification panel</h2>
              <p class="eta">About 2m left</p>
            </div>
            <button class="dismiss" type="button" aria-label="Dismiss Preparing a preview of the updated notification panel"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="m2.5 2.5 7 7m0-7-7 7"/></svg></button>
          </div>
          <div class="progress-row">
            <div class="progress-track" role="progressbar" aria-label="Preparing a preview of the updated notification panel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="22"><div class="progress-fill" style="width:22%"></div></div>
            <span class="percentage">22%</span>
          </div>
          <p class="added">Added 47 seconds ago</p>
        </article>
      </div>
    </section>
  </main>
  <script>
    // Read-only layout checks; no network, timers, or app behavior.
    requestAnimationFrame(() => {
      const panel = document.querySelector('.progress-panel');
      const elements = [...panel.querySelectorAll('*')];
      const bounds = panel.getBoundingClientRect();
      console.log(JSON.stringify({
        panelWidth: bounds.width,
        itemCount: panel.querySelectorAll('.item-card').length,
        titleHeights: [...panel.querySelectorAll('.item-title')].map(el => el.getBoundingClientRect().height),
        barHeights: [...panel.querySelectorAll('.progress-track')].map(el => el.getBoundingClientRect().height),
        overflow: elements.filter(el => {
          const box = el.getBoundingClientRect();
          return box.left < bounds.left || box.right > bounds.right;
        }).length,
        agesFit: [...panel.querySelectorAll('.added')].every(el => el.scrollWidth <= el.clientWidth)
      }));
    });
  </script>
</body>
</html>
