<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Notifier — age below progress</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 390px;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      background: #dce2e3;
      color: #252729;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Extract this panel and the .pn-c rules for a combined comparison. */
    .pn-c {
      --mint: #3bb8a3;
      --secondary: #62666a;
      width: 350px;
      flex: 0 0 350px;
      padding: 10px;
      border-radius: 20px;
      background: rgba(246, 247, 248, .86);
      backdrop-filter: blur(28px) saturate(120%);
      -webkit-backdrop-filter: blur(28px) saturate(120%);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08), 0 16px 36px rgba(25, 35, 40, .18);
      text-align: left;
    }
    .pn-c button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--secondary);
      padding: 0;
      font: inherit;
      display: grid;
      place-items: center;
      flex: none;
    }
    .pn-c button:focus-visible { outline: 2px solid var(--mint); outline-offset: 1px; border-radius: 4px; }
    .pn-c svg { display: block; }
    .pn-c .header { display: flex; align-items: center; gap: 8px; padding: 0 4px; min-height: 24px; margin-bottom: 8px; }
    .pn-c .heading { font-size: 17px; font-weight: 600; margin: 0; line-height: 24px; flex: 1; }
    .pn-c .count { font-size: 10px; font-weight: 500; color: var(--secondary); line-height: 12px; padding: 4px 8px; border-radius: 20px; background: rgba(0, 0, 0, .05); white-space: nowrap; }
    .pn-c .controls { display: flex; gap: 4px; }
    .pn-c .controls button { width: 24px; height: 24px; }
    .pn-c .items { display: grid; gap: 6px; padding: 4px; }
    .pn-c .item { border-radius: 12px; padding: 9px 12px; background: rgba(0, 0, 0, .035); }
    .pn-c .item-top { display: flex; align-items: flex-start; gap: 8px; }
    .pn-c .item-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .pn-c .project { display: flex; align-items: center; gap: 5px; min-height: 12px; font-size: 10px; line-height: 12px; font-weight: 500; color: var(--secondary); }
    .pn-c .project-icon { width: 12px; height: 12px; border-radius: 3px; background: #737b84; color: white; font-size: 8px; line-height: 12px; text-align: center; }
    .pn-c .title { margin: 0; font-size: 13px; font-weight: 600; line-height: 16px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .pn-c .eta { font-size: 11px; line-height: 14px; color: var(--secondary); font-variant-numeric: tabular-nums; }
    .pn-c .dismiss { width: 22px; height: 22px; }
    .pn-c .task-icon { color: var(--mint); background: rgba(59, 184, 163, .12); width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; flex: none; }
    .pn-c .progress-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; height: 16px; }
    .pn-c .track { height: 5px; flex: 1; overflow: hidden; border-radius: 20px; background: rgba(59, 184, 163, .13); }
    .pn-c .fill { height: 100%; border-radius: inherit; background: var(--mint); }
    .pn-c .percent { width: 38px; text-align: right; font-size: 13px; line-height: 16px; font-weight: 600; color: var(--mint); font-variant-numeric: tabular-nums; font-family: ui-rounded, -apple-system, BlinkMacSystemFont, sans-serif; }
    .pn-c .added { margin: 4px 0 0; color: var(--secondary); font-size: 11px; line-height: 14px; font-variant-numeric: tabular-nums; }
    @media (max-width: 389px) { body { padding: 20px 0; justify-content: start; } }
  </style>
</head>
<body>
  <section class="pn-c" aria-label="Expanded Progress Notifier">
    <header class="header">
      <h1 class="heading">Progress</h1>
      <span class="count">2 active</span>
      <div class="controls">
        <button type="button" aria-label="Minimize progress"><svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><path d="M2 5.5h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button type="button" aria-label="Close progress window"><svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><path d="m2.5 2.5 6 6m0-6-6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      </div>
    </header>
    <div class="items">
      <article class="item">
        <div class="item-top">
          <div class="item-text">
            <div class="project"><span class="project-icon" aria-hidden="true">P</span>Progress Notifier</div>
            <h2 class="title">Refine expanded panel layout and verify keyboard controls</h2>
            <div class="eta">About 4m left</div>
          </div>
          <button class="dismiss" type="button" aria-label="Dismiss Refine expanded panel layout and verify keyboard controls"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="m2.5 2.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        </div>
        <div class="progress-row"><div class="track" role="progressbar" aria-label="Refine expanded panel layout and verify keyboard controls" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68"><div class="fill" style="width:68%"></div></div><span class="percent" aria-hidden="true">68%</span></div>
        <p class="added">Added 5 minutes ago</p>
      </article>
      <article class="item">
        <div class="item-top">
          <span class="task-icon" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M12.7 5.7A5 5 0 0 0 4.1 4.4L2.8 6M3.3 10.3a5 5 0 0 0 8.6 1.3l1.3-1.6M2.8 2.9V6h3.1m7.3 7.1V10h-3.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <div class="item-text">
            <h2 class="title">Prepare release archive and validate the signed application</h2>
            <div class="eta">About 2m left</div>
          </div>
          <button class="dismiss" type="button" aria-label="Dismiss Prepare release archive and validate the signed application"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="m2.5 2.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        </div>
        <div class="progress-row"><div class="track" role="progressbar" aria-label="Prepare release archive and validate the signed application" aria-valuemin="0" aria-valuemax="100" aria-valuenow="24"><div class="fill" style="width:24%"></div></div><span class="percent" aria-hidden="true">24%</span></div>
        <p class="added">Added 47 seconds ago</p>
      </article>
    </div>
  </section>
  <script>
    window.addEventListener('load', () => {
      const panel = document.querySelector('.pn-c');
      const items = [...panel.querySelectorAll('.item')];
      console.log(JSON.stringify({
        panelWidth: panel.getBoundingClientRect().width,
        panelHeight: panel.getBoundingClientRect().height,
        itemCount: items.length,
        titleLines: [...panel.querySelectorAll('.title')].map(el => el.clientHeight / 16),
        addedFits: [...panel.querySelectorAll('.added')].every(el => el.scrollWidth <= el.clientWidth && el.clientHeight === 14),
        horizontalOverflow: [...panel.querySelectorAll('*')].filter(el => el.getBoundingClientRect().right > panel.getBoundingClientRect().right + .5).map(el => el.className)
      }));
    });
  </script>
</body>
</html>
