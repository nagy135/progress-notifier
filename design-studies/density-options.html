<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:transparent}*{box-sizing:border-box}
#density-options{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--foreground);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.option-label{font-size:13px;font-weight:600;margin:0 0 6px}.spec{font-size:11px;color:var(--muted-foreground);margin:0 0 14px}
.panel{--pn-bg:light-dark(#f4f5f3,#252725);--pn-card:light-dark(#e9ece8,#2c302c);--pn-text:light-dark(#252b27,#d9ded9);--pn-muted:light-dark(#626c65,#9aa49b);--pn-line:light-dark(#c4cdc6,#424b43);--pn-mint:light-dark(#167866,#45b6a3);--pn-purple:light-dark(#9351aa,#bb73d2);background:var(--pn-bg);color:var(--pn-text);border:1px solid var(--pn-line);border-radius:16px;padding:10px 12px;max-width:350px;width:100%;margin:auto;font-size:10.5px;line-height:1.22;--pad:6px;--note-gap:3px;--title:12px;--desc:10.5px;--meta:9px;--row-gap:4px;--group-gap:12px}
.panel h2{font-size:15px;margin:0;font-weight:650}.chrome{display:flex;align-items:center;gap:10px;margin-bottom:10px}.chrome .count{margin-left:auto;background:var(--pn-card);border-radius:10px;padding:3px 7px;font-size:9px;color:var(--pn-muted)}
.panel button{font:inherit;color:var(--pn-muted);background:none;border:0;padding:0;cursor:pointer}.panel button:hover{color:var(--pn-text)}.panel button:focus-visible{outline:1px solid var(--pn-mint);outline-offset:2px}.close{font-size:16px!important;line-height:14px;flex-shrink:0;width:16px}
.group{margin-top:var(--group-gap)}.group:first-of-type{margin-top:0}.group-head{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;margin:0 0 5px}.chat{margin-left:auto;color:var(--pn-muted);font:8px ui-monospace,monospace}.icon{display:inline-grid;place-items:center;flex-shrink:0;width:15px;height:15px;font-size:12px}.monogram{font-size:8px;font-weight:800;color:var(--pn-mint);background:color-mix(in srgb,var(--pn-mint) 14%,transparent);border-radius:4px}
.timeline{border-left:1px solid var(--pn-line);margin-left:4px;padding-left:10px;display:flex;flex-direction:column;gap:var(--row-gap)}
.task{position:relative;background:var(--pn-card);border-radius:8px;padding:var(--pad) 8px;border:1px solid transparent;--tint:var(--pn-mint)}.task.selected{border-color:var(--pn-mint)}.task:before{content:'';position:absolute;width:4px;height:4px;border-radius:100%;border:1px solid var(--pn-mint);left:-14px;top:10px;background:var(--pn-bg)}
.task.child{margin-left:10px;border:1px dashed color-mix(in srgb,var(--pn-purple) 48%,transparent);--tint:var(--pn-purple)}.task.child:before{width:7px;height:10px;border:0;border-left:1px solid var(--pn-purple);border-bottom:1px solid var(--pn-purple);border-radius:0;left:-9px;top:0;background:none}
.title-row{display:flex;align-items:center;gap:5px;min-width:0}.task-title{font-size:var(--title);font-weight:600;flex:1;min-width:0;line-height:1.2}.branch{color:var(--pn-muted);font-size:10px}.note-row{display:flex;align-items:baseline;gap:8px;margin-top:var(--note-gap)}.note{margin:0;font-size:var(--desc);line-height:1.28;flex:1;min-width:0}.age{font-size:8px;color:var(--pn-muted);white-space:nowrap}
.task-footer{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:var(--meta);color:var(--pn-muted);font-variant-numeric:tabular-nums;min-height:11px}.badge{padding:0 4px;background:color-mix(in srgb,var(--pn-text) 8%,transparent);border-radius:7px;font-size:8px}.earlier{font-size:8px;margin-right:1px}.eta{white-space:nowrap}.track{height:3px;flex:1;margin-left:auto;min-width:30px;max-width:80px;border-radius:3px;background:color-mix(in srgb,var(--tint) 17%,transparent)}.fill{height:100%;background:var(--tint);border-radius:3px}.percent{color:var(--tint);font-size:10px;font-weight:650;width:28px;text-align:right}.bottom{display:flex;align-items:center;justify-content:space-between;color:var(--pn-muted);font-size:9px;margin-top:10px}.key{font:8px ui-monospace,monospace}.history{display:none;margin-top:6px;padding-top:5px;border-top:1px solid var(--pn-line);font-size:var(--desc);color:var(--pn-muted)}.history.open{display:block}
.extra{padding:7px 9px;border-radius:13px;--pad:4px;--note-gap:1px;--title:11px;--desc:9.5px;--meta:8px;--row-gap:3px;--group-gap:8px}.extra h2{font-size:13px}.extra .chrome{margin-bottom:7px}.extra .group-head{font-size:9px;margin-bottom:3px}.extra .icon{width:12px;height:12px;font-size:10px}.extra .monogram{font-size:7px}.extra .task{border-radius:6px;padding-left:6px;padding-right:6px}.extra .task-footer{margin-top:2px;min-height:9px}.extra .percent{font-size:9px}.extra .bottom{margin-top:7px;font-size:8px}.extra .close{font-size:13px!important;width:13px}.extra .timeline{padding-left:8px}.extra .task:before{left:-12px}.extra .task.child:before{left:-9px}.extra .age{font-size:7.5px}.extra .badge{font-size:7px}.extra .track{height:2px}
@media(max-width:620px){#density-options{grid-template-columns:1fr;gap:22px}.option-label,.spec{max-width:350px;margin-left:auto;margin-right:auto}}
</style></head><body>
<main id="density-options" aria-label="Progress panel density options">
<section><h3 class="option-label">Dense</h3><p class="spec">12 px titles · 10.5 px descriptions · 3 px note gap</p><div class="panel" id="dense"></div></section>
<section><h3 class="option-label">Extra dense</h3><p class="spec">11 px titles · 9.5 px descriptions · 1 px note gap</p><div class="panel extra" id="extra"></div></section>
</main>
<script>
const root=document.getElementById('density-options');
const groups=[{name:'metzler-website-relaunch-2026',icon:'🏦',chat:'8fac9c',tasks:[{name:'Fix Stiftung gaps',note:'Live markup analysed; renderer and forms agents starting',eta:'7m left',age:'1h',pct:10,earlier:1},{name:'Stiftung renderer fixes',note:'Starting',eta:'Finishing soon',age:'1h',pct:0,child:true},{name:'Stiftung form fixes',note:'Starting',eta:'Finishing soon',age:'1h',pct:0,child:true}]},{name:'wow-browser',icon:'WB',chat:'e716cc',tasks:[{name:'Implement WoW spell fidelity',note:'260 explicit actions compiled; replacing combat timelines and persistent aura lifecycles',eta:'50m left',age:'Now',pct:20,earlier:1}]}];
for(const panel of root.querySelectorAll('.panel')){
 panel.innerHTML='<header class="chrome"><h2>Progress</h2><span class="count">4 active</span><button class="close" aria-label="Close panel">×</button></header>'+groups.map((g,gi)=>`<section class="group"><div class="group-head"><span class="icon ${g.icon==='WB'?'monogram':''}">${g.icon}</span><span>${g.name}</span><span class="chat">${g.chat}</span></div><div class="timeline">${g.tasks.map((t,ti)=>`<article class="task ${t.child?'child':''} ${gi===0&&ti===0?'selected':''}"><div class="title-row"><span class="icon ${g.icon==='WB'?'monogram':''}">${g.icon}</span>${t.child?'<span class="branch">↳</span>':''}<span class="task-title">${t.name}</span><button class="close" aria-label="Hide ${t.name}">×</button></div><div class="note-row"><p class="note">${t.note}</p><span class="age">${t.age}</span></div><div class="task-footer">${t.earlier?`<span class="earlier">⌄ ${t.earlier}</span>`:''}${t.child?'<span class="badge">Child</span>':''}<span class="eta">${t.eta}</span><div class="track" role="progressbar" aria-label="${t.name}" aria-valuenow="${t.pct}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${t.pct}%"></div></div><span class="percent">${t.pct}%</span></div>${t.earlier?'<div class="history">Earlier · Setting up the workspace and preparing implementation.</div>':''}</article>`).join('')}</div></section>`).join('')+'<footer class="bottom"><button class="updates">◷ Show updates <span class="key">D</span></button><span class="key">↑↓ J/K</span></footer>';
 panel.querySelectorAll('article').forEach(card=>{card.addEventListener('click',()=>{panel.querySelectorAll('article').forEach(c=>c.classList.remove('selected'));card.classList.add('selected')});card.querySelector('.close').onclick=e=>{e.stopPropagation();card.hidden=true}});
 panel.querySelector('.updates').onclick=()=>panel.querySelector('.task.selected .history')?.classList.toggle('open');
 panel.querySelector('.chrome .close').onclick=()=>{panel.style.opacity=panel.style.opacity==='0.4'?'1':'0.4'};
}
if(globalThis.Tweak){for(const panel of root.querySelectorAll('.panel')){const s={descriptionSize:panel.classList.contains('extra')?9.5:10.5};const tweak=new Tweak({container:panel,onChange:()=>panel.style.setProperty('--desc',s.descriptionSize+'px')});tweak.addSlider(s,'descriptionSize',{label:'Description size',min:8,max:12,step:0.5,unit:'px'})}}
</script></body></html>
